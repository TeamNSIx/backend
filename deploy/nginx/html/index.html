<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFU Student Adaptation Chatbot</title>
    <style>
        :root {
            color-scheme: light dark;
            --accent: #005696;
            --bg: #f4f7fb;
            --text: #1a1a1a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1.5rem;
        }
        main {
            max-width: 40rem;
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.5rem;
        }
        p { line-height: 1.6; }
        code {
            background: #eef3f8;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <h1>Чат-бот адаптации студента КФУ</h1>
        <p>
            Backend запущен через Docker Compose. REST API доступен по префиксу
            <code>/api/v1</code> (например, <code>/api/v1/auth/login</code>).
        </p>
        <p>
            Для фронтенда используйте базовый URL:
            <code>http://localhost/api/v1</code>
        </p>
        <p>
            <a href="/docs">Swagger UI</a> ·
            <a href="/redoc">ReDoc</a> ·
            <a href="/api/v1/auth/login">API</a>
        </p>
    </main>
</body>
</html>
